name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR makes the first run's answer worthless, so cancel it
# rather than pay for a verdict about a commit nobody will merge. Runs on main are
# never cancelled: each one is the record of whether that commit is green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Ahead of setup-node, which needs pnpm on PATH to locate the store it caches.
      # No version here on purpose: the action reads packageManager from
      # package.json, so the runner and a laptop cannot drift onto different builds.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails when pnpm-lock.yaml and package.json disagree, which is what a
      # dependency added without committing the lockfile looks like.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Ordered fastest first so an obvious break reports in seconds. Each check
      # still runs when an earlier one fails: one run should show every problem,
      # not whichever happened to be scheduled first.
      - name: Guard
        run: npm run guard

      - name: Test
        if: '!cancelled()'
        run: npm test

      # Component tests: Vitest + jsdom over the Client Components a visitor
      # meets first (docs/ui-tests-plan.md §3). Hermetic — fetch and the router
      # are stubbed — and a separate runner because node:test cannot host jsdom
      # and JSX; the two runners' globs are disjoint by extension.
      - name: Component tests
        if: '!cancelled()'
        run: npm run test:ui

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      # THE SEMANTIC CACHE GATE (docs/semantic-cache-gate-plan.md): re-runs the
      # cache's match decision — cosine under the key model, τ, both halves of
      # the entity guard — over frozen labelled pairs and fails on any NEW false
      # accept against the committed baseline. A step here rather than a job:
      # it is pure (no database, no provider, no network — an import allow-list
      # test enforces that), takes seconds, and is enforced through `ci` today.
      - name: Cache gate
        if: '!cancelled()'
        run: npm run cache:gate -- gate ${{ github.event_name != 'pull_request' && '--strict' || '' }}

      # These are placeholders, not secrets. next build evaluates module scope and
      # prerenders, so the two db URLs and the Supabase pair have to parse or the
      # build throws before it compiles anything; nothing here is dialled, because
      # postgres.js connects lazily and no page fetches at build time. Real values
      # would buy nothing and would bake into the client bundle, which is why a CI
      # build is never the artifact that ships.
      - name: Build
        if: '!cancelled()'
        env:
          DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          RAG_APP_DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

      # AFTER the build, because it reads the build's own output. `next build`
      # succeeding says nothing about what @vercel/nft put in the Lambda, and the
      # gap between those two is where every background job spent weeks 500ing on
      # a missing libonnxruntime.so.1. See docs/serverless-bundle-fix-plan.md.
      - name: Trace guard
        if: '!cancelled()'
        run: npm run guard:trace

  # A SECOND JOB, not more steps on the first. These need a database, so they
  # fail for reasons the hermetic checks never can — a job boundary is what keeps
  # "the schema is broken" distinguishable from "the lint is unhappy" at a glance,
  # and lets the two run in parallel.
  #
  # NO SECRETS, deliberately. Nothing here can reach the live Supabase project,
  # which is what makes the tier safe to run on every pull request from anyone.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Version-matched to the live project (PostgreSQL 17.6, pgvector 0.8.0).
        # The migrations declare exactly two extensions, pgcrypto and vector, and
        # this image carries both.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        # Without the health check the job races initdb: the container answers
        # once, restarts internally to apply config, and the first connection
        # dies mid-handshake.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The replay IS the first test. A migration that cannot be applied to an
      # empty database fails here, before anything else runs — which is how the
      # two backfill defects and the missing RLS enablement were found.
      #
      # MIGRATE_BOOTSTRAP puts the auth.users shim on ahead of 0001: Supabase
      # provides that schema, a bare Postgres does not, and four migrations
      # reach for it.
      - name: Replay migrations
        env:
          MIGRATE_BOOTSTRAP: test/sql
        run: npm run migrate

      - name: Integration tests
        if: '!cancelled()'
        run: npm run itest

  # THE RETRIEVAL REGRESSION GATE (docs/ci-eval-gate-plan.md). Loads a frozen
  # 236-chunk corpus with every lane's cached vectors, runs 118 held-out
  # questions through the real retriever with the HNSW index dropped (exact
  # scan, so the numbers are deterministic), and compares Recall@5 / MRR /
  # nDCG@5 against the committed baseline. Its own job for the same reason
  # `integration` is: "retrieval regressed" has to be distinguishable from "a
  # migration broke" at a glance.
  #
  # NO SECRETS and no provider calls — the fixture carries every vector, and
  # `score` fails the run if a provider key was ever touched — so fork PRs run
  # it too. The margin lives here, in the one place a reviewer will look.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rag_test
      # Below one question in 118 (0.0085): any lost hit is red, float
      # formatting is not.
      EVAL_GATE_MARGIN: "0.005"
      # The statement budget (docs/obs-4-ci-budgets-plan.md §1.1): the app's
      # client-side statement count over the same scoring run. Deterministic
      # over the fixture, so 2% is room for an intended change, not for noise.
      # (scripts/eval-gate.ts turns the meter on regardless; named here so the
      # job says what it measures.)
      RAG_STATEMENT_METER: "1"
      EVAL_GATE_STMT_MARGIN: "0.02"

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Replay migrations
        env:
          MIGRATE_BOOTSTRAP: test/sql
        run: npm run migrate

      - name: Load fixture
        run: npm run eval:gate -- load

      # On a PR: red when Recall@5 falls past the margin; MRR and nDCG warn.
      - name: Gate
        if: github.event_name == 'pull_request'
        run: npm run eval:gate -- gate

      # On main: the committed baseline must be reproduced EXACTLY, in both
      # directions, or "the stored baseline from main" has quietly stopped
      # being true and main goes red until someone refreshes it.
      - name: Gate (strict)
        if: github.event_name != 'pull_request'
        run: npm run eval:gate -- gate --strict
