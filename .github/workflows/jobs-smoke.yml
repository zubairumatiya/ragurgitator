# THE ONLY LAYER THAT PROVES A JOB FINISHES.
#
# smoke.yml proves a route ANSWERS. That is a different claim from "a background
# job launches, slices, chains, checkpoints and completes" — the thing that had
# never once worked in production. Only driving a real job end to end shows that.
#
# workflow_dispatch ONLY, and deliberately not on every PR: this needs
# DATABASE_URL and the deployment's JOBS_SECRET, it spends real provider calls
# against a BYOK key, and it writes rows to the live jobs ledger. Run it after a
# deploy that touches lib/jobs/**. See docs/serverless-bundle-fix-plan.md phase 7.
name: Jobs smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: The deployment to drive (e.g. https://ragurgitator.com)
        required: true
        default: https://ragurgitator.com
      # LABELLED BY COST, because the dispatch screen is the last place anyone
      # reads before spending money and it used to show five verbs that looked
      # interchangeable. They are not: `background` re-scores over cached query
      # vectors and bills nothing, while `autotune` runs a real tuning sweep
      # against a BYOK key. The run step strips the label back off.
      verb:
        description: Which jobs-smoke verb to run
        required: true
        default: background (free)
        type: choice
        options:
          - background (free)
          - sweep (free)
          - launch (free, no assertions)
          - autotune (SPENDS — real tuning sweep)
          - abandon (SPENDS — and rewrites eval_results)
      # `background` only. The smallest document finishes inside one slice at
      # production's real 240s budget, which makes the chain and cancel
      # assertions report INCONCLUSIVE; `all` is how you cross a slice boundary
      # on a deployment whose budget you cannot lower. Both are free.
      scope:
        description: "background only: how much of the config to score"
        required: true
        default: smallest-document
        type: choice
        options: [smallest-document, all]

permissions:
  contents: read

jobs:
  jobs-smoke:
    runs-on: ubuntu-latest
    # Sized for the widest scope this can be dispatched with, not the narrowest.
    # `background all` over a few hundred questions takes several of production's
    # real 240s slices -- that is the point of it -- and a job killed by the
    # runner's clock reports as a failure of the deployment rather than of the
    # budget it was given.
    timeout-minutes: 45
    # A named environment SCOPES the secrets: only a job that declares this
    # environment can read them, so the rest of the repo's workflows cannot. That
    # is all it does here — there are no protection rules on it, so a dispatch
    # runs immediately. Add required reviewers on the environment if you want the
    # approval step; do not assume one exists because the environment does.
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # SMOKE_ALLOW_WRITES is the script's own second lock: the verbs that write
      # (background, launch, autotune, abandon) refuse to run without it, so an
      # accidental dispatch reads rather than writes. `cancel` and `sweep` stay
      # ungated on purpose — they are the recovery tools, and locking those locks
      # the wrong thing.
      #
      # Note this lock does NOT distinguish free from expensive: `background`
      # needs it too, because it writes rows. The cost labels on the dropdown
      # above are the only thing that tells them apart, which is why they are
      # there.
      - name: Drive a real job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
          JOBS_BASE_URL: ${{ github.event.inputs.base_url }}
          SCRIPT_CONFIG_ID: ${{ secrets.SMOKE_CONFIG_ID }}
          SMOKE_ALLOW_WRITES: "1"
          # Only needed against a PROTECTED preview, where Vercel's wall answers
          # before the app does. Harmless (and unset) against production.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Not the runner's budget — that is read from the SERVER's environment
          # (lib/jobs/runner.ts). This only bounds how long the harness waits
          # before calling a job hung, and must stay under timeout-minutes above
          # so a slow run fails with the harness's own verdict rather than as a
          # bare cancelled step.
          SMOKE_TIMEOUT_MS: "2400000"
          SMOKE_SCOPE: ${{ github.event.inputs.scope }}
          # Through the environment rather than interpolated into the command:
          # a `${{ }}` expression pasted into a shell line is a script-injection
          # seam, and a constrained choice input today is not a guarantee about
          # what this input accepts tomorrow.
          VERB_INPUT: ${{ github.event.inputs.verb }}
        # Strip the cost label back off — "autotune (SPENDS — ...)" -> "autotune".
        run: node --import tsx scripts/jobs-smoke.ts "${VERB_INPUT%% *}"
